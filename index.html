<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funtime Sushi & Ramen & Tea Bar – Feedback</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #222;
      text-align: center;
      padding: 30px 18px;
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #fffaf3;
      padding: 32px 22px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      border-top: 8px solid #c62828;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #b71c1c;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .promo {
      font-weight: bold;
      color: #b71c1c;
      font-size: 18px;
      margin-bottom: 22px;
    }

    .stars {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .stars button {
      display: block;
      width: 100%;
      font-size: 28px;
      background: #ffffff;
      cursor: pointer;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #e0c7a5;
      transition: 0.2s;
    }

    .stars button:hover {
      background: #fff3e0;
      transform: scale(1.04);
    }

    .note {
      font-size: 14px;
      color: #666;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Funtime Sushi & Ramen & Tea Bar</h1>

    <p>How was your experience today?</p>

    <p class="promo">
      🎁 Share your feedback and enjoy a FREE milk tea on site!
    </p>

    <div class="stars">
      <button onclick="goToFeedback(1)">⭐ </button>
      <button onclick="goToFeedback(2)">⭐⭐ </button>
      <button onclick="goToFeedback(3)">⭐⭐⭐ </button>
      <button onclick="goToReview(4)">⭐⭐⭐⭐ </button>
      <button onclick="goToReview(5)">⭐⭐⭐⭐⭐ </button>
    </div>

    <p class="note">
      Show your review to our staff to redeem your free milk tea.
    </p>

    <p class="note">
      Thank you for supporting Funtime Sushi & Ramen & Tea Bar. We truly appreciate your honest feedback!
    </p>
  </div>

  <script>
    const googleReviewLink = "https://search.google.com/local/writereview?placeid=ChIJ_1vQo1RlZIgRNfXFoRKrQTM";
    const internalFeedbackLink = "https://forms.gle/ZwnVJNb7HdFp5ckH7";

    function goToReview(rating) {
      window.location.href = googleReviewLink;
    }

    function goToFeedback(rating) {
      window.location.href = internalFeedbackLink;
    }
  </script>
</body>
</html>
